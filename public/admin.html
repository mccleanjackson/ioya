<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IOYA · Admin</title>
<link rel="icon" href="/ioya_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Admin "Maintain" pages (/admin#users, #contacts, #groups, #splits, #methods). Only admins
   (users.is_admin, checked by is_admin() in the database) can see or change anything here. */
:root{
  --paper:#FAFBFC; --card:#FFFFFF; --ink:#15171C; --muted:#5C6371; --line:#D9DEE6; --soft:#F1F3F7;
  --accent:#CC6FCC; --accent-dark:#A94BA9; --accent-soft:#F6E5F6; --pen:#3654D1;
  --bad:#C3311E; --bad-soft:#FBE2DE;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:3px;border-radius:6px}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 18px var(--f-display)}
.brand .logo{display:block;width:96px;height:36px;overflow:hidden}
.brand .logo img{width:126px;max-width:none;margin:-25px 0 0 -15px}
.brand small{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--accent-soft);padding:6px 9px;border-radius:999px}
.who{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:0;cursor:pointer;font-weight:700;text-decoration:none;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.layout{max-width:1200px;margin:0 auto;padding:28px 20px 60px;display:grid;grid-template-columns:240px 1fr;gap:28px}
.side{display:flex;flex-direction:column;gap:4px}
.side a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;font-weight:600;color:var(--muted)}
.side a:hover{background:var(--soft);color:var(--ink)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
h1{font:800 32px/1.1 var(--f-display);margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border-radius:18px;box-shadow:inset 0 0 0 1.5px var(--line);padding:28px}
.alert{border-radius:12px;padding:14px 16px;background:var(--bad-soft);color:#7E1F12}
@media (max-width:800px){.layout{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><span class="logo"><img src="/ioya_logo.png" alt="IOYA"></span><small>Admin</small></a>
  <div class="who" id="who"></div>
</div></header>
<div class="layout">
  <nav class="side" id="side" aria-label="Tables"></nav>
  <main id="main"><p class="lede">Loading…</p></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/session.js"></script>
<script>
(function(){
'use strict';
const CFG = window.IOYA_CONFIG || {};
const sb = window.supabase && CFG.supabaseUrl && CFG.supabaseAnonKey
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, window.IOYA_AUTH_OPTIONS || {}) : null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABLES = {users:'Users', contacts:'Contacts', groups:'Groups', splits:'Splits', methods:'Payment Methods'};
const main = document.getElementById('main');
let me = null;

function page(){
  const k = TABLES[location.hash.slice(1)] ? location.hash.slice(1) : 'users';
  document.getElementById('side').innerHTML = Object.entries(TABLES)
    .map(([key, label]) => `<a href="#${key}" ${key === k ? 'aria-current="page"' : ''}>${label}</a>`).join('');
  main.innerHTML = `<h1>Maintain ${TABLES[k]}</h1><p class="lede">Add, view, edit and delete ${TABLES[k].toLowerCase()}.</p>
    <div class="card"><p>This table's page is coming in the next update.</p></div>`;
  main.querySelector('h1').focus?.();
}
function stop(msg){
  document.getElementById('side').innerHTML = '';
  main.innerHTML = `<h1>Admins only</h1><div class="alert" role="alert">${esc(msg)}</div><p><a class="btn" href="/#account">Go to the log-in page</a></p>`;
}

async function start(){
  if (!sb) return stop('Supabase settings are missing, so the admin pages are unavailable.');
  const {data:{session}} = await sb.auth.getSession();
  if (!session || session.user.is_anonymous) return stop('Log in with an admin account to maintain IOYA\'s tables.');
  const ok = await sb.rpc('is_admin');
  if (ok.error) return stop(/is_admin/.test(ok.error.message) ? 'The database needs an update: run supabase/admin-login.sql in the Supabase SQL Editor.' : ok.error.message);
  if (ok.data !== true) return stop(`${session.user.email} is not an admin account.`);
  me = session.user;
  document.getElementById('who').innerHTML = `<span>${esc(me.email)}</span><button class="btn ghost" type="button" id="logout">Log out</button>`;
  document.getElementById('logout').addEventListener('click', async () => {
    await sb.auth.signOut({scope:'local'}).catch(() => {});
    window.IOYA_CLEAR_LOGIN_COOKIES?.();
    location.href = '/#account';
  });
  window.addEventListener('hashchange', page);
  page();
}
start();
})();
</script>
</body>
</html>
